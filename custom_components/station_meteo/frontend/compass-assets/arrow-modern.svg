<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <title>Flèche moderne de direction du vent</title>
  <desc>Calque vectoriel transparent de 320 par 320 pixels, avec une flèche bleue effilée, une pointe ajourée et un empennage aérodynamique à plumes. À faire pivoter autour du centre de la rose des vents.</desc>
  <defs>
    <linearGradient id="shaft" x1="156" y1="78" x2="164" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF7FF"/>
      <stop offset=".2" stop-color="#4BB4FF"/>
      <stop offset=".55" stop-color="#0879E2"/>
      <stop offset="1" stop-color="#0A4B9F"/>
    </linearGradient>
    <linearGradient id="head" x1="135" y1="28" x2="184" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2F8FF"/>
      <stop offset=".3" stop-color="#58BCFF"/>
      <stop offset=".72" stop-color="#1676D9"/>
      <stop offset="1" stop-color="#0A4D9F"/>
    </linearGradient>
    <linearGradient id="fins" x1="126" y1="238" x2="194" y2="283" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A4B9F"/>
      <stop offset=".48" stop-color="#57BCFF"/>
      <stop offset="1" stop-color="#0A58B6"/>
    </linearGradient>
    <filter id="shadow" x="104" y="14" width="112" height="292" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Empennage fluide : ailettes courtes inspirées de plumes. -->
    <g fill="url(#fins)" stroke="#07468F" stroke-width="1.7">
      <path d="M156 232 C143 242 130 251 116 258 C129 269 145 266 159 254 C162 246 160 238 156 232Z"/>
      <path d="M164 232 C177 242 190 251 204 258 C191 269 175 266 161 254 C158 246 160 238 164 232Z"/>
      <path d="M156 243 C146 255 139 269 136 284 C150 277 159 265 164 251 C162 247 159 244 156 243Z"/>
      <path d="M164 243 C174 255 181 269 184 284 C170 277 161 265 156 251 C158 247 161 244 164 243Z"/>
    </g>
    <g fill="none" stroke="#DFF7FF" stroke-opacity=".82" stroke-width="1.5">
      <path d="M158 251 C146 255 135 258 123 260"/>
      <path d="M162 251 C174 255 185 258 197 260"/>
      <path d="M158 250 C149 261 143 272 139 279"/>
      <path d="M162 250 C171 261 177 272 181 279"/>
    </g>
    <!-- Hampe fine, continue de la pointe jusqu'à l'empennage en traversant le centre. -->
    <path d="M160 76 L160 260" stroke="#073D82" stroke-width="9"/>
    <path d="M160 76 L160 260" stroke="url(#shaft)" stroke-width="5.5"/>
    <path d="M158.5 100 L158.5 243" stroke="#E8FAFF" stroke-opacity=".9" stroke-width="1.3"/>
    <!-- Pointe métallique ajourée, plus légère et effilée. -->
    <path fill="url(#head)" fill-rule="evenodd" stroke="#073F85" stroke-width="2.2" d="M160 27 L195 89 L168 76 L164 100 L156 100 L152 76 L125 89 Z M160 47 L178 81 L166 74 L162 91 L158 91 L154 74 L142 81 Z"/>
    <path d="M160 32 L189 83 L171 74" stroke="#E7F9FF" stroke-opacity=".95" stroke-width="1.6"/>
    <path d="M149 79 L132 85" stroke="#D9F5FF" stroke-opacity=".86" stroke-width="1.4"/>
    <!-- Repère central discret, raccord avec le cabochon de la rose. -->
    <circle cx="160" cy="160" r="4.8" fill="#1685E8" stroke="#DDF7FF" stroke-width="1.4"/>
    <circle cx="158.6" cy="158.7" r="1.15" fill="#FFFFFF"/>
  </g>
</svg>
