<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}</style></head><body><station-meteo-panel></station-meteo-panel><script type="module" src="/station_meteo/frontend/station-meteo.js"></script><script type="module">
const paths=await(await fetch('/icons.json')).json();
class HAIcon extends HTMLElement{connectedCallback(){const key=this.getAttribute('icon')?.replace('mdi:','');this.innerHTML=`<svg viewBox="0 0 24 24" style="display:block;width:100%;height:100%;fill:currentColor"><path d="${paths[key]||''}"></path></svg>`;this.style.display='inline-flex';this.style.width='var(--mdc-icon-size,26px)';this.style.height='var(--mdc-icon-size,26px)';}}
customElements.define('ha-icon',HAIcon);
await customElements.whenDefined('station-meteo-panel');
const ids={temperature:'sensor.exterieur_station_meteo_temperature',humidity:'sensor.exterieur_station_meteo_humidity',pressure:'sensor.exterieur_station_meteo_pressure',illuminance:'sensor.exterieur_station_meteo_illuminance',uv:'sensor.exterieur_station_meteo_uv_index',wind_speed:'sensor.exterieur_station_meteo_speed',wind_gust:'sensor.exterieur_station_meteo_speed_2',wind_direction:'sensor.exterieur_station_meteo_direction',rain_total:'sensor.exterieur_station_meteo_precipitation',rain_status:'binary_sensor.exterieur_station_meteo_moisture',dew_point:'sensor.exterieur_station_meteo_dew_point',battery:'sensor.exterieur_station_meteo_battery',weather:'weather.meteo_france'};
const values={temperature:24.3,humidity:41,pressure:987.8,illuminance:33590,uv:2,wind_speed:.9,wind_gust:2.5,wind_direction:153,rain_total:0,rain_status:'off',dew_point:10.2,battery:100,weather:'partlycloudy'};
const units={temperature:'°C',humidity:'%',pressure:'mbar',illuminance:'lx',wind_speed:'m/s',wind_gust:'m/s',wind_direction:'°',rain_total:'mm',dew_point:'°C',battery:'%'};
let cfg={location:'Casefabre',altitude:247,language:'auto',wind_unit:'km/h',pressure_mode:'absolute',lux_factor:126.7,estimate_irradiance:true,entities:{...ids},device_id:''};
const states={};for(const [k,eid]of Object.entries(ids))states[eid]={entity_id:eid,state:String(values[k]),attributes:{friendly_name:k,unit_of_measurement:units[k],...(k==='weather'?{supported_features:3,temperature_unit:'°C',wind_speed_unit:'km/h',precipitation_unit:'mm'}:{})}};
states['sensor.adguard_queries']={entity_id:'sensor.adguard_queries',state:'100',attributes:{friendly_name:'AdGuard queries'}};states['sensor.dns_queries']={entity_id:'sensor.dns_queries',state:'42',attributes:{device_class:'atmospheric_pressure',friendly_name:'DNS queries'}};window.qaCalls=[];window.qaPanel=document.querySelector('station-meteo-panel');window.qaStates=states;
const tomorrow=new Date(Date.now()+86400000);tomorrow.setHours(12,0,0,0);
const forecasts={hourly:Array.from({length:12},(_,i)=>({datetime:new Date(Date.now()+i*3600000).toISOString(),temperature:24-i*.65,precipitation_probability:i*7,condition:i<4?'partlycloudy':'rainy'})),daily:[{datetime:tomorrow.toISOString(),temperature:21,templow:15,precipitation_probability:70,precipitation:3.2,wind_speed:18,wind_gust_speed:32,condition:'rainy'}]};
window.qaForecasts=forecasts;states['weather.met_no']={entity_id:'weather.met_no',state:'cloudy',attributes:{friendly_name:'Met.no',supported_features:3,temperature_unit:'°C',wind_speed_unit:'km/h',precipitation_unit:'mm'}};window.qaPanel.hass={language:'fr',config:{time_zone:'Europe/Paris'},user:{is_admin:true},states,
 callWS:async msg=>{window.qaCalls.push(msg);if(msg.type==='station_meteo/history'){const start=Date.now()-12*3600000;return window.qaArchiveResult||{role:msg.role,scale:msg.scale,date:msg.date,start:msg.date,end:msg.date,configured:true,estimated:false,import_status:'ready',summary:{value:0,min:0,max:0,seconds:0,partial:true},points:Array.from({length:12},(_,i)=>({t:start+i*3600000,end:start+(i+1)*3600000,value:0,min:0,max:0,seconds:3600,partial:false,gust:null})),today:qaPanel.dayKey(Date.now())};}if(msg.type==='station_meteo/satellite')return window.qaSatelliteResult||{frames:Array.from({length:3},(_,i)=>({time:new Date(Date.now()-(2-i)*600000).toISOString(),url:'/satellite-test.jpg?frame='+i})),credit:'EUMETSAT / NASA'};if(msg.type==='station_meteo/ephemeris')return {date:window.qaPanel.dayKey(Date.now()),sunrise:new Date().toISOString(),sunset:new Date().toISOString(),noon:new Date().toISOString(),moon_phase:'waning_crescent',moon_illumination:8,next_full_moon:"2026-10-26T05:11:44+01:00",next_new_moon:"2026-11-09T08:02:03+01:00",almanac_status:'ok',almanac:{saint:'Saint de démonstration',quote:'Citation de démonstration.',saying:'Dicton de démonstration.'}};if(msg.type==='station_meteo/forecast')return {hourly:structuredClone(forecasts.hourly).map(f=>({...f,_sources:Object.fromEntries(Object.keys(f).filter(k=>k!=='datetime').map(k=>[k,ids.weather]))})),daily:structuredClone(forecasts.daily),sources:{[ids.weather]:'Météo-France'},units:{temperature:'°C',wind_speed:'km/h',precipitation:'mm'},errors:[]};if(msg.type==='station_meteo/notification_targets')return ['persistent_notification.create','notify.mobile_app_test'];if(msg.type==='station_meteo/entity_exclusions')return ['sensor.dns_queries'];if(msg.type==='station_meteo/config')return structuredClone(cfg);if(msg.type==='station_meteo/catalog')return [{id:'ws90',name:'SBWS-90CM D693',original_name:'SBWS-90CM D693',model:'SBWS-90CM',identifiers:[['bthome','C0:2C:ED:95:D6:93']],mapping:ids,ambiguous:[],disabled:[]}];if(msg.type==='station_meteo/save'){cfg=structuredClone(msg.config);return structuredClone(cfg);}if(msg.type==='call_service')return {response:{[ids.weather]:{forecast:forecasts[msg.service_data.type]}}};throw Error('Unknown command');},
 callApi:async(method,path,data)=>{if(method==='POST'&&path==='station_meteo/image'){window.qaUploaded=data;return {url:data.kind==='arrow'?'/station_meteo/images/test-arrow.svg':data.content.startsWith('UklGR')?'/station_meteo/images/test-cloud.webp':'/station_meteo/images/test-photo.jpg'};}(window.qaHistoryPaths??=[]).push(path);const url=new URL('/api/'+path,location.origin);const start=Date.parse(decodeURIComponent(url.pathname.split('/').at(-1)));const end=url.searchParams.has('end_time')?Date.parse(url.searchParams.get('end_time')):start+86400000;if(window.qaRecentHistory){return [[{entity_id:ids.temperature,state:'21',last_changed:new Date(Date.now()-600000).toISOString()},{state:'25',last_changed:new Date(Date.now()-300000).toISOString()}].filter(s=>Date.parse(s.last_changed)>=start&&Date.parse(s.last_changed)<=end)];}if(window.qaHistoryError)throw Error('Recorder unavailable');return Object.entries(ids).filter(([k])=>!['weather','rain_status'].includes(k)).map(([k,eid])=>Array.from({length:60},(_,i)=>({entity_id:eid,state:String(Number(values[k])+(k==='rain_total'?0:Math.sin(i*.3)*(k==='pressure'?1:k==='illuminance'?5000:2))),last_changed:new Date(Date.now()-(59-i)*30*60000).toISOString()})).filter(s=>Date.parse(s.last_changed)>=start&&Date.parse(s.last_changed)<=end));}};
</script></body></html>
